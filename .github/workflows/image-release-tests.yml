name: Shared image CI
on:
  push:
    branches: [master]
    paths:
      - image-*/**
      - .github/workflows/image-*.yml
  pull_request:
    paths:
      - image-*/**
      - .github/workflows/image-*.yml
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./image-build
        with:
          arch: amd64
      - name: Bash release contracts
        run: bash image-stage/tests/release.sh
      - name: Real loopback registry
        run: bash image-stage/tests/registry.sh
      - name: Lint workflow
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 .github/workflows/image-release-tests.yml
