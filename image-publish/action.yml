name: Publish tested image digests
description: Validate the complete release and publish indexes from tested digests.
inputs:
  canonical-repository:
    description: Exact GitHub repository allowed to publish
    required: true
  default-branch:
    description: Release branch
    required: true
  repository:
    description: Docker Hub repository
    required: true
  tags:
    description: Complete expected stable-tag JSON array
    required: true
  architectures:
    description: Expected native architectures
    default: '["amd64","arm64"]'
  architecture-aliases:
    description: Retain Node's x86_64/aarch64 compatibility tags
    default: 'false'
  username:
    description: Docker Hub username
    required: true
  password:
    description: Docker Hub token
    required: true
runs:
  using: composite
  steps:
    - uses: actions/download-artifact@v8.0.2
      with:
        pattern: images-${{ github.run_id }}-${{ github.run_attempt }}-*
        path: release-metadata
    - name: Validate release before login
      shell: bash
      env:
        RELEASE_CANONICAL_REPOSITORY: ${{ inputs.canonical-repository }}
        RELEASE_BRANCH: ${{ inputs.default-branch }}
        RELEASE_REPOSITORY: ${{ inputs.repository }}
        RELEASE_TAGS: ${{ inputs.tags }}
        RELEASE_ARCHES: ${{ inputs.architectures }}
      run: bash "$GITHUB_ACTION_PATH/../image-stage/release.sh" validate
    - uses: docker/setup-buildx-action@v4
      with:
        driver: docker
    - uses: docker/login-action@v4
      with:
        username: ${{ inputs.username }}
        password: ${{ inputs.password }}
    - name: Publish indexes
      shell: bash
      env:
        RELEASE_CANONICAL_REPOSITORY: ${{ inputs.canonical-repository }}
        RELEASE_BRANCH: ${{ inputs.default-branch }}
        RELEASE_REPOSITORY: ${{ inputs.repository }}
        RELEASE_TAGS: ${{ inputs.tags }}
        RELEASE_ARCHES: ${{ inputs.architectures }}
        RELEASE_ARCH_ALIASES: ${{ inputs.architecture-aliases }}
      run: bash "$GITHUB_ACTION_PATH/../image-stage/release.sh" publish
